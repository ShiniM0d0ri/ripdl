# Offline CI: compile + run the full test suite on both target platforms.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # The workspace check compiles ripdl-gui (native egui + tray-icon), which
      # needs GTK/xdo/appindicator and Wayland/OpenGL headers on Linux.
      - name: Install GUI build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libxdo-dev libayatana-appindicator3-dev \
            libxkbcommon-dev libwayland-dev libgl1-mesa-dev

      - name: Check (all targets)
        run: cargo check --workspace --all-targets

      # Generated TypeScript bindings must match the Rust RPC types.
      - name: Generated protocol types are current
        run: cargo run -p xtask -- protocol --check

      - name: Test (fully offline)
        run: cargo test --workspace

      # Extension plugin layer: recipe engine + script shape + built-ins.
      - name: Extension plugin tests
        run: node ext/test/plugins.test.mjs

      # Browser handoff contract: one onDeterminingFilename decision per download.
      - name: Extension handoff tests
        run: node ext/test/handoff.test.mjs
