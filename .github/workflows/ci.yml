# Offline CI: compile + run the full test suite on both target platforms.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # The workspace check compiles ripdl-gui (Tauri shell), which needs
      # webkit2gtk/gtk dev headers on Linux.
      - name: Install GUI build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - name: Check (all targets)
        run: cargo check --workspace --all-targets

      - name: Test (fully offline)
        run: cargo test --workspace

      # Extension plugin layer: recipe engine + script shape + built-ins.
      - name: Extension plugin tests
        run: node ext/test/plugins.test.mjs

      # Browser handoff contract: one onDeterminingFilename decision per download.
      - name: Extension handoff tests
        run: node ext/test/handoff.test.mjs
