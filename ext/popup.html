<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      color-scheme: light;
      --ink: #172522;
      --muted: #687772;
      --line: #dce5e1;
      --surface: #fff;
      --wash: #f3f7f5;
      --teal: #0c7669;
      --teal-dark: #075c53;
      --warn: #a45c10;
      --bad: #a43b36;
    }
    * { box-sizing: border-box; }
    body {
      width: 360px;
      margin: 0;
      background: var(--surface);
      color: var(--ink);
      font: 13px/1.4 "Segoe UI", system-ui, sans-serif;
    }
    button, input { font: inherit; }
    .shell { padding: 16px 17px 14px; }
    .masthead { display: flex; align-items: center; gap: 10px; }
    .brand-mark {
      display: grid; place-items: center; width: 34px; height: 34px;
      border-radius: 9px; background: var(--teal); color: white;
      font-size: 21px; font-weight: 700; line-height: 1;
    }
    .brand { min-width: 0; }
    h1 { margin: 0; font-size: 16px; line-height: 1.1; font-weight: 700; }
    .tagline { margin-top: 3px; color: var(--muted); font-size: 11px; }
    .status-row { display: flex; align-items: center; gap: 7px; margin: 13px 0 12px; }
    #status { flex: 1; color: var(--muted); font-size: 11.5px; }
    #status::before {
      content: ""; display: inline-block; width: 7px; height: 7px;
      margin-right: 6px; border-radius: 50%; background: #9aa9a3; vertical-align: 1px;
    }
    #status.ok { color: #186b46; }
    #status.ok::before { background: #279867; }
    #status.down { color: var(--warn); }
    #status.down::before { background: #c77b23; }
    #probe {
      border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px;
      color: #34433e; background: white; cursor: pointer; font-size: 11px;
    }
    #probe:hover { border-color: #9abbb0; background: var(--wash); }
    #version {
      margin: 0 0 10px; padding: 7px 9px; border: 1px solid var(--line);
      border-radius: 6px; background: var(--wash); color: var(--muted);
      font-size: 11px; line-height: 1.4; overflow-wrap: anywhere;
    }
    #version.warn { color: var(--warn); border-color: #ead3b3; background: #fff9ef; }
    .control-list { border-top: 1px solid var(--line); }
    .control-row {
      display: flex; align-items: center; gap: 12px; min-height: 60px;
      border-bottom: 1px solid var(--line); cursor: pointer;
    }
    .control-copy { flex: 1; min-width: 0; }
    .control-label { display: block; font-weight: 650; font-size: 12.5px; }
    .control-help { display: block; margin-top: 2px; color: var(--muted); font-size: 10.5px; }
    input.switch { appearance: none; position: relative; flex: none; width: 36px; height: 20px;
      margin: 0; border: 1px solid #aebdb7; border-radius: 12px; background: #e6ece9; cursor: pointer; }
    input.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px;
      border-radius: 50%; background: white; box-shadow: 0 1px 2px #17252233; transition: transform .14s ease; }
    input.switch:checked { border-color: var(--teal); background: var(--teal); }
    input.switch:checked::after { transform: translateX(16px); }
    input.switch:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid #268f80; outline-offset: 2px; }
    #hunt { margin-top: 12px; padding: 11px; border: 1px solid #cfe2da; border-radius: 8px; background: #f2f8f5; }
    #hunt.hidden { display: none; }
    #hunt-title { margin: 0 0 8px; color: #31574c; font-size: 11px; font-weight: 700; text-transform: uppercase; }
    .hunt-btn, .hunt-file-btn {
      width: 100%; border: 1px solid #b9d3c9; border-radius: 6px; padding: 7px 9px;
      color: var(--teal-dark); background: white; cursor: pointer; font-size: 11.5px; font-weight: 600;
    }
    .hunt-btn:hover, .hunt-file-btn:hover { border-color: var(--teal); background: #f8fcfa; }
    .hunt-url { margin: 8px 0 4px; color: var(--muted); font-size: 10px; overflow-wrap: anywhere; }
    .hunt-media-row { padding-top: 7px; }
    .hunt-note { margin-top: 7px; color: #276c4e; font-size: 10.5px; }
    .footer { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
    .privacy { flex: 1; color: var(--muted); font-size: 10px; }
    #plugins-link { color: var(--teal-dark); font-size: 11px; font-weight: 650; text-decoration: none; white-space: nowrap; }
    #plugins-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main class="shell">
    <header class="masthead">
      <div class="brand-mark" aria-hidden="true">r</div>
      <div class="brand"><h1>ripdl</h1><div class="tagline">Browser download controls</div></div>
    </header>
    <div class="status-row"><span id="status" class="down">daemon: connecting…</span><button id="probe" type="button">Refresh</button></div>
    <div id="version" aria-live="polite"></div>
    <div class="control-list">
      <label class="control-row" for="capture">
        <span class="control-copy"><span class="control-label">Intercept downloads</span><span class="control-help">Send browser downloads to ripdl while it is running.</span></span>
        <input type="checkbox" id="capture" class="switch">
      </label>
      <label class="control-row" for="shareCookies">
        <span class="control-copy"><span class="control-label">Share cookies</span><span class="control-help">Only for downloads you start; browser permission required.</span></span>
        <input type="checkbox" id="shareCookies" class="switch">
      </label>
    </div>
    <section id="hunt" class="hidden" aria-live="polite">
      <h2 id="hunt-title">Video or stream detected</h2>
      <button id="hunt-page" class="hunt-btn" type="button">Download page as video</button>
      <div id="hunt-media"></div>
    </section>
    <footer class="footer">
      <span class="privacy">Cookies stay local and are only attached to downloads you send.</span>
      <a href="#" id="plugins-link">Hoster plugins &rarr;</a>
    </footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
