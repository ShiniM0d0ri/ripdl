<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      color-scheme: light dark;
      --ink: #172522;
      --muted: #5b6d67;
      --line: #dce5e1;
      --surface: #ffffff;
      --surface-2: #ffffff;
      --wash: #f3f7f5;
      --teal: #0c7669;
      --teal-dark: #075c53;
      --ok: #186b46;
      --warn: #a45c10;
      --warn-bg: #fff9ef;
      --warn-border: #ead3b3;
      --bad: #a43b36;
      --hunt-bg: #f2f8f5;
      --hunt-border: #cfe2da;
      --hunt-title: #31574c;
      --switch-track: #e6ece9;
      --switch-border: #aebdb7;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #e6eff2;
        --muted: #8ea3ac;
        --line: #273941;
        --surface: #0e171b;
        --surface-2: #152229;
        --wash: #16242b;
        --teal: #179484;
        --teal-dark: #4ee0b5;
        --ok: #4ee0b5;
        --warn: #f0b45a;
        --warn-bg: #2a2012;
        --warn-border: #5b4320;
        --bad: #f27c75;
        --hunt-bg: #132229;
        --hunt-border: #25404b;
        --hunt-title: #7edec0;
        --switch-track: #22343d;
        --switch-border: #38505a;
      }
    }
    * { box-sizing: border-box; }
    body {
      width: 364px;
      margin: 0;
      background: var(--surface);
      color: var(--ink);
      font: 13px/1.4 "Segoe UI", system-ui, sans-serif;
    }
    button, input { font: inherit; }
    .icon { flex: none; display: block; }
    .shell { padding: 16px 17px 14px; }
    .masthead { display: flex; align-items: center; gap: 10px; }
    .brand-mark { display: block; flex: none; border-radius: 9px; }
    .brand { min-width: 0; }
    h1 { margin: 0; font-size: 16px; line-height: 1.1; font-weight: 700; }
    .tagline { margin-top: 3px; color: var(--muted); font-size: 11px; }
    .status-row { display: flex; align-items: center; gap: 7px; margin: 13px 0 11px; }
    #status { flex: 1; color: var(--muted); font-size: 11.5px; }
    #status::before {
      content: ""; display: inline-block; width: 7px; height: 7px;
      margin-right: 6px; border-radius: 50%; background: #9aa9a3; vertical-align: 1px;
    }
    #status.ok { color: var(--ok); }
    #status.ok::before { background: #279867; }
    #status.down { color: var(--warn); }
    #status.down::before { background: #d48628; }
    #probe {
      display: inline-flex; align-items: center; gap: 5px;
      border: 1px solid var(--line); border-radius: 6px; padding: 4px 9px;
      color: var(--ink); background: var(--surface-2); cursor: pointer; font-size: 11px; font-weight: 600;
    }
    #probe:hover { border-color: var(--teal); background: var(--wash); }
    #version {
      margin: 0 0 10px; padding: 7px 9px; border: 1px solid var(--line);
      border-radius: 6px; background: var(--wash); color: var(--muted);
      font-size: 11px; line-height: 1.4; overflow-wrap: anywhere;
    }
    #version.warn { color: var(--warn); border-color: var(--warn-border); background: var(--warn-bg); }
    .control-list { border-top: 1px solid var(--line); }
    .control-row {
      display: flex; align-items: center; gap: 12px; min-height: 58px;
      border-bottom: 1px solid var(--line); cursor: pointer;
    }
    .control-copy { flex: 1; min-width: 0; }
    .control-label { display: block; font-weight: 650; font-size: 12.5px; }
    .control-help { display: block; margin-top: 2px; color: var(--muted); font-size: 10.5px; }
    input.switch { appearance: none; position: relative; flex: none; width: 36px; height: 20px;
      margin: 0; border: 1px solid var(--switch-border); border-radius: 12px; background: var(--switch-track); cursor: pointer; }
    input.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px;
      border-radius: 50%; background: white; box-shadow: 0 1px 2px #17252233; transition: transform .14s ease; }
    input.switch:checked { border-color: var(--teal); background: var(--teal); }
    input.switch:checked::after { transform: translateX(16px); }
    input.switch:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid #268f80; outline-offset: 2px; }
    #hunt { margin-top: 12px; padding: 11px; border: 1px solid var(--hunt-border); border-radius: 8px; background: var(--hunt-bg); }
    #hunt.hidden { display: none; }
    #hunt-title { display: flex; align-items: center; gap: 6px; margin: 0 0 8px; color: var(--hunt-title); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
    .hunt-btn, .hunt-file-btn {
      width: 100%; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      border: 1px solid var(--hunt-border); border-radius: 6px; padding: 7px 10px;
      color: var(--teal-dark); background: var(--surface-2); cursor: pointer; font-size: 11.5px; font-weight: 600;
    }
    .hunt-btn.hidden { display: none; }
    .hunt-btn:hover, .hunt-file-btn:hover { border-color: var(--teal); background: var(--wash); }
    .hunt-url { margin: 8px 0 4px; color: var(--muted); font-size: 10px; overflow-wrap: anywhere; }
    .hunt-media-row { padding-top: 7px; }
    .hunt-note { margin-top: 7px; color: var(--ok); font-size: 10.5px; }
    .footer { display: flex; align-items: center; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
    .privacy { flex: 1; min-width: 150px; color: var(--muted); font-size: 10px; }
    .footer-links { display: inline-flex; align-items: center; gap: 10px; }
    #plugins-link, #welcome-link {
      display: inline-flex; align-items: center; gap: 4px;
      color: var(--teal-dark); font-size: 11px; font-weight: 650; text-decoration: none; white-space: nowrap;
    }
    #plugins-link:hover, #welcome-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main class="shell">
    <header class="masthead">
      <svg class="brand-mark" viewBox="0 0 512 512" width="34" height="34" aria-hidden="true">
        <rect width="512" height="512" rx="112" fill="#0b3230"/>
        <rect x="104" y="176" width="86" height="20" rx="10" fill="#4ee0b5" opacity="0.55"/>
        <rect x="104" y="242" width="64" height="20" rx="10" fill="#4ee0b5" opacity="0.75"/>
        <rect x="104" y="308" width="42" height="20" rx="10" fill="#4ee0b5"/>
        <path d="M222 132h68v122h62L256 384 160 254h62z" fill="#ffffff"/>
      </svg>
      <div class="brand"><h1>ripdl</h1><div class="tagline">Browser download controls</div></div>
    </header>
    <div class="status-row"><span id="status" class="down">daemon: connecting…</span><button id="probe" type="button"><svg class="icon" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>Refresh</button></div>
    <div id="version" aria-live="polite"></div>
    <div class="control-list">
      <label class="control-row" for="capture">
        <span class="control-copy"><span class="control-label">Intercept downloads</span><span class="control-help">Send browser downloads to ripdl while it is running.</span></span>
        <input type="checkbox" id="capture" class="switch">
      </label>
      <label class="control-row" for="shareCookies">
        <span class="control-copy"><span class="control-label">Share cookies</span><span class="control-help">Only for downloads you start; browser permission required.</span></span>
        <input type="checkbox" id="shareCookies" class="switch">
      </label>
    </div>
    <section id="hunt" class="hidden" aria-live="polite">
      <h2 id="hunt-title"><svg class="icon" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M7 3v18"/><path d="M3 7.5h4"/><path d="M3 12h18"/><path d="M3 16.5h4"/><path d="M17 3v18"/><path d="M17 7.5h4"/><path d="M17 16.5h4"/></svg>Video or stream detected</h2>
      <button id="hunt-page" class="hunt-btn" type="button"><svg class="icon" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/></svg><span class="btn-label">Download page as video</span></button>
      <div id="hunt-media"></div>
    </section>
    <footer class="footer">
      <span class="privacy">Cookies stay local and are only attached to downloads you send.</span>
      <span class="footer-links">
        <a href="#" id="welcome-link">Setup guide</a>
        <a href="#" id="plugins-link"><svg class="icon" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15.39 4.39a1 1 0 0 0 1.68-.474 2.5 2.5 0 1 1 3.014 3.015 1 1 0 0 0-.474 1.68l1.683 1.682a2.414 2.414 0 0 1 0 3.414L19.61 15.39a1 1 0 0 1-1.68-.474 2.5 2.5 0 1 0-3.014 3.015 1 1 0 0 1 .474 1.68l-1.683 1.682a2.414 2.414 0 0 1-3.414 0L8.61 19.61a1 1 0 0 0-1.68.474 2.5 2.5 0 1 1-3.014-3.015 1 1 0 0 0 .474-1.68l-1.683-1.682a2.414 2.414 0 0 1 0-3.414L4.39 8.61a1 1 0 0 1 1.68.474 2.5 2.5 0 1 0 3.014-3.015 1 1 0 0 1-.474-1.68l1.683-1.682a2.414 2.414 0 0 1 3.414 0z"/></svg>Hoster plugins</a>
      </span>
    </footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
