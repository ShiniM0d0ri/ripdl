<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="ripdl logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.55" y2="1">
      <stop offset="0" stop-color="#4d9edc"/>
      <stop offset="0.55" stop-color="#2f74ab"/>
      <stop offset="1" stop-color="#1f5384"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.26"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#shine)"/>

  <!-- three uplinks feeding one stream -->
  <g stroke="#ffffff" stroke-width="21" stroke-linecap="round" fill="none">
    <path d="M142 146l94 62" opacity="0.66"/>
    <path d="M256 82v126" opacity="0.9"/>
    <path d="M370 146l-94 62" opacity="0.66"/>
