[package]
name = "ripdl-core"
description = "Multi-segment download engine for ripdl"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tokio = { workspace = true }
tokio-util = { workspace = true }
reqwest = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
futures = { workspace = true }
bytes = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
dirs = { workspace = true }
anyhow = "1"
librqbit = { version = "9", default-features = false, features = ["default-tls"] }
# NIC bonding: enumerate uplink interfaces (gateway metadata) so the
# engine can bind segments to one interface each. MIT, pure Rust.
netdev = { version = "0.46.3", default-features = false, features = ["gateway"] }

[dev-dependencies]
# Loopback seeder↔leecher trace output: librqbit's internal decisions
# (piece selection, only_files handling) are only visible via tracing.
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }
