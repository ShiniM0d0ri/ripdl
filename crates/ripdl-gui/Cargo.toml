[package]
name = "ripdl-gui"
description = "Desktop GUI for ripdl (native egui shell over the daemon RPC)"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "ripdl-gui"
path = "src/main.rs"

[dependencies]
ripdl-core = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
dirs = "6"
rfd = "0.15"
eframe = "0.37"
egui = "0.37"
tray-icon = "0.25"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_os = "windows")'.build-dependencies]
embed-resource = "3.0"
