[package]
name = "ripdl-gui"
description = "Desktop GUI for ripdl (Tauri shell over the daemon RPC)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "ripdl-gui"
path = "src/main.rs"

[dependencies]
ripdl-core = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
dirs = "6"
rfd = "0.15"

[build-dependencies]
tauri-build = "2"

[dependencies.tauri]
version = "2"
features = ["tray-icon"]

# Suspend the WebView2 while the window sits in the tray (webview_mem.rs).
# Both crates are already in the tree through wry; pin to the versions wry
# resolves so the COM interface types stay identical.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
