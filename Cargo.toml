[workspace]
resolver = "2"
members = ["crates/ripdl-core", "crates/ripdl-cli", "crates/ripdl-daemon", "crates/ripdl-gui", "vendor/librqbit"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "ripdl - free, ad-free, multi-segment download manager"

[workspace.dependencies]
ripdl-core = { path = "crates/ripdl-core" }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "gzip"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
bytes = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
dirs = "6"
clap = { version = "4", features = ["derive"] }
indicatif = "0.17"
anyhow = "1"
time = { version = "0.3", features = ["local-offset"] }

# Torrent NIC bonding: use our vendored librqbit fork (upstream ikatson/rqbit
# 9.0.1, Apache-2.0) instead of the crates.io one. The only delta is support
# for binding outgoing peer connections to a rotating list of local source
# addresses (`SessionOptions::bind_ips`). See vendor/librqbit/README.md and
# AGENTS.md.
[patch.crates-io]
librqbit = { path = "vendor/librqbit" }

[profile.release]
lto = "thin"
