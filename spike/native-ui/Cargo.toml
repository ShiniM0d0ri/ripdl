[package]
name = "ripdl-native-ui-spike"
version = "0.0.0"
edition = "2021"
publish = false

# Keep the spike out of the main workspace so eframe never affects product builds.
[workspace]

# The main workspace patches librqbit to our vendored fork. The spike is an
# independent workspace, so it needs the same patch for ripdl-core to build.
[patch.crates-io]
librqbit = { path = "../../vendor/librqbit" }

[dependencies]
ripdl-core = { path = "../../crates/ripdl-core" }
eframe = { version = "0.37", features = ["inspection"] }
egui = "0.37"
serde_json = "1"
tokio = { version = "1", features = ["full"] }
egui_inspection = "0.37"
anyhow = "1"
